name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Lint and test are independent on purpose. A lint failure must never hide
  # whether the suite passes — that is how main stayed dark while pytest never
  # ran in Actions.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run pytest with coverage
        run: |
          pytest --disable-warnings --junitxml=test-results.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can diff against the PR base (or main on push).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.1.0"

      - name: Ruff on changed files (blocking on pull_request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=ACMRTUXB "$BASE"...HEAD \
              | grep -E '\.py$' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No Python files changed; nothing to lint."
            exit 0
          fi
          echo "Linting ${#CHANGED[@]} changed file(s):"
          printf '  %s\n' "${CHANGED[@]}"
          ruff check "${CHANGED[@]}"

      - name: Legacy ruff debt (advisory, non-blocking)
        # Full-tree count stays visible so the number can only trend down.
        # Never fail the job for legacy findings; the ratchet above owns new code.
        continue-on-error: true
        run: |
          echo "::notice title=Legacy ruff debt::Full-tree ruff statistics (advisory; does not fail CI)"
          ruff check . --statistics || true
