name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # A successful deploy only means the upload succeeded. After v0.4.0,
  # production served the docs/ self-redirect stub as / while
  # dashboard/index.html still rendered locally. This job reads the HTML
  # files and fails if there is no visible text without JavaScript.
  landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check landing HTML is visible without JS
        run: python3 tests/test_landing_html.py

  # Lint and test are independent on purpose. A lint failure must never hide
  # whether the suite passes — that is how main stayed dark while pytest never
  # ran in Actions.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      # No --maxfail: report every failure in one CI run.
      - name: Run pytest with coverage
        run: |
          pytest --disable-warnings --junitxml=test-results.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        # v6 keeps files/fail_ci_if_error and pins github-script@v8 (Node 24).
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        # v5 still targets Node 20; v6 is Node 24 and clears the runner deprecation.
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml

  # tests/conftest.py prepends src/ to sys.path, so the test job only ever
  # exercises the checkout. A wheel that omits a module, an entry point, or a
  # documented subcommand is invisible to the whole suite — the same class of
  # blind spot as pytest never having run in Actions. This job builds the
  # wheel, installs it into a fresh venv, and runs from a directory that is
  # not the checkout.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --wheel
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one wheel in dist/, found: ${wheels[*]:-none}" >&2
            exit 1
          fi
          echo "Built ${wheels[0]}"
          python -m zipfile --list "${wheels[0]}"

      - name: Install wheel into a clean venv and smoke-test
        run: |
          set -euo pipefail
          unset PYTHONPATH
          EXPECTED="$(python -c "import tomllib, pathlib; print(tomllib.load(pathlib.Path('pyproject.toml').open('rb'))['project']['version'])")"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "expected exactly one wheel in dist/, found: ${wheels[*]:-none}" >&2
            exit 1
          fi
          WHEEL="$(cd "$(dirname "${wheels[0]}")" && pwd)/$(basename "${wheels[0]}")"

          VENV="${RUNNER_TEMP}/packaging-venv"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install "$WHEEL"

          WORK="$(mktemp -d "${RUNNER_TEMP}/packaging-cwd.XXXXXX")"
          cd "$WORK"

          HELP="$("$VENV/bin/agentos" --help)"
          printf '%s\n' "$HELP"
          EXPECTED="$EXPECTED" CHECKOUT="$GITHUB_WORKSPACE" HELP="$HELP" \
            "$VENV/bin/python" - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          needed = (
              "serve",
              "mcp",
              "version",
              "init",
              "record",
              "replay",
              "trace",
              "diff",
              "bisect",
          )
          help_text = os.environ["HELP"]
          match = re.search(r"\{([^{}]+)\}", help_text)
          if match is None:
              raise SystemExit(
                  "agentos --help did not list subcommands in {a,b,...} form"
              )
          listed = {
              part.strip() for part in match.group(1).split(",") if part.strip()
          }
          missing = [cmd for cmd in needed if cmd not in listed]
          if missing:
              raise SystemExit(
                  "agentos --help is missing documented subcommand(s): "
                  + ", ".join(missing)
                  + f"; listed={sorted(listed)}"
              )

          src_on_path = [p for p in sys.path if Path(p).resolve().name == "src"]
          if src_on_path:
              raise SystemExit(f"src/ is on sys.path: {src_on_path}")

          import agentos

          pkg = Path(agentos.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"agentos.__file__ = {pkg}")
          if "site-packages" not in pkg.parts:
              raise SystemExit(
                  f"agentos was not loaded from site-packages: {pkg}"
              )
          if pkg.is_relative_to(checkout):
              raise SystemExit(
                  f"agentos was loaded from the checkout, not the wheel: {pkg}"
              )
          PY

          "$VENV/bin/python" -c "import agentos.replay.bisect, agentos.replay.diff"

          GOT="$("$VENV/bin/agentos" version)"
          echo "agentos version: $GOT"
          echo "pyproject.toml:  $EXPECTED"
          if [[ "$GOT" != "AgentOS v${EXPECTED}" ]]; then
            echo "version mismatch: agentos version printed '$GOT', expected 'AgentOS v${EXPECTED}'" >&2
            exit 1
          fi
          echo "packaging smoke test passed"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history so we can diff against the PR base (or first parent on push).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.1.0"

      - name: Ruff on changed files (blocking on pull_request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=ACMRTUXB "$BASE"...HEAD \
              | grep -E '\.py$' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No Python files changed; nothing to lint."
            exit 0
          fi
          echo "Linting ${#CHANGED[@]} changed file(s) against BASE=$BASE:"
          printf '  %s\n' "${CHANGED[@]}"
          ruff check "${CHANGED[@]}"

      - name: Ruff on changed files (blocking on push to main)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # On a PR merge commit, HEAD^1 is the previous main tip, so the
          # changed set equals exactly what the PR changed. Never fall back to
          # linting the full tree — that would block main on legacy debt.
          if ! BASE="$(git rev-parse --verify HEAD^1 2>/dev/null)"; then
            echo "No first parent for HEAD (or rev-parse failed); skipping changed-file lint."
            exit 0
          fi
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=ACMRTUXB "$BASE"...HEAD \
              | grep -E '\.py$' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No Python files changed vs BASE=$BASE; nothing to lint."
            exit 0
          fi
          echo "Linting ${#CHANGED[@]} changed file(s) against BASE=$BASE (HEAD^1):"
          printf '  %s\n' "${CHANGED[@]}"
          ruff check "${CHANGED[@]}"

      - name: Legacy ruff debt (advisory, non-blocking)
        # Full-tree count stays visible so the number can only trend down.
        # Never fail the job for legacy findings; the ratchet above owns new code.
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "::notice title=Legacy ruff debt::Full-tree ruff statistics (advisory; does not fail CI)"
          set +e
          STATS="$(ruff check . --statistics 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$STATS"
          TOTAL="$(printf '%s\n' "$STATS" | sed -nE 's/^Found ([0-9]+) error.*$/\1/p' | tail -1)"
          if [ -z "${TOTAL:-}" ]; then
            if [ "$RC" -eq 0 ]; then
              TOTAL=0
            else
              TOTAL="unknown"
            fi
          fi
          {
            echo "## Legacy ruff debt (advisory)"
            echo ""
            echo "**${TOTAL}** findings on full tree. Tracked in [#34](https://github.com/sukethrp/agentos/issues/34)."
            echo ""
            echo "This step is non-blocking. The changed-file ratchet above is what keeps main green."
            echo ""
            echo '```'
            printf '%s\n' "$STATS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Always succeed: advisory only.
          true
